receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch: {}
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
  # In AWS, replace with the awsxray / CloudWatch exporters (see docs/architecture/observability.md)
service:
  pipelines:
    traces: {receivers: [otlp], processors: [batch], exporters: [otlp/jaeger]}
