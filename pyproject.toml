[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-assurance-ai"
version = "0.2.0"
description = "Revenue assurance on Amazon Bedrock: deterministic reconciliation plus a multi-agent exception tier."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "mcp>=2.0,<3",
]

[project.scripts]
ra = "ra.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
bedrock = ["boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ra*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", ".claude/hooks"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Header", "ra.api.app.require"]

[tool.ruff.lint.per-file-ignores]
"src/ra/api/app.py" = ["B008"]   # FastAPI dependency declarations

[tool.setuptools.package-data]
ra = ["web/*.html"]
