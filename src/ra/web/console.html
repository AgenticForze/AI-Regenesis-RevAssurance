<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue Assurance Console</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#17202b;--muted:#5b6775;--line:#dde2e8;--accent:#0b5cad;
--accent-ink:#fff;--good:#14744a;--bad:#b3261e;--warn:#8a5a00;--chip:#eef2f6;--radius:6px}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--panel:#171e26;--ink:#e6ebf1;--muted:#9aa7b5;
--line:#2a3441;--accent:#6db1f2;--accent-ink:#0f141a;--good:#5fd09a;--bad:#ff8a80;--warn:#f2c14e;--chip:#222c38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:1rem;margin:0;letter-spacing:.01em}
header .who{margin-left:auto;color:var(--muted);font-size:.85rem}
nav{display:flex;gap:.25rem;padding:.5rem 1.25rem 0;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:.5rem .8rem;color:var(--muted);font:inherit;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
main{padding:1.25rem;max-width:1280px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;margin-bottom:1rem}
.panel h2{font-size:.95rem;margin:0 0 .7rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.8rem 1rem}
.kpi .label{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .sub{color:var(--muted);font-size:.8rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.4rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--chip)}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:.05rem .55rem;font-size:.78rem}
.ok{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
button.btn,input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.4rem .6rem}
button.btn{cursor:pointer}button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:1rem}
@media (max-width:900px){.split{grid-template-columns:1fr}}
pre{background:var(--chip);padding:.6rem;border-radius:var(--radius);overflow:auto;font-size:.78rem;margin:.4rem 0;white-space:pre-wrap;word-break:break-word}
.bar{height:.55rem;background:var(--accent);border-radius:3px;min-width:2px}
.span{font-family:ui-monospace,monospace;font-size:.78rem;white-space:nowrap}
#login{max-width:22rem;margin:12vh auto}
#login label{display:block;margin:.7rem 0 .2rem;color:var(--muted)}
#login input{width:100%}
#msg{position:fixed;right:1rem;bottom:1rem;max-width:26rem;padding:.7rem 1rem;border-radius:var(--radius);background:var(--ink);color:var(--bg);display:none}
.muted{color:var(--muted)}.hidden{display:none}
</style>
</head>
<body>
<section id="login" class="panel">
  <h1 style="font-size:1.15rem;margin:.2rem 0 0">Revenue Assurance</h1>
  <p class="muted">Sign in to the console.</p>
  <form id="loginForm">
    <label for="u">Username</label><input id="u" autocomplete="username" required>
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
    <div class="row" style="margin-top:1rem"><button class="btn primary">Sign in</button><span id="loginErr" class="bad" role="alert"></span></div>
  </form>
</section>
<div id="app" class="hidden">
  <header><h1>Revenue Assurance</h1><span id="runInfo" class="muted"></span>
    <span class="who" id="who"></span><button class="btn" id="logout">Sign out</button></header>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div id="msg" role="status"></div>
<script>
"use strict";
let token = null, me = null, tab = "overview";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (v) => v == null ? "-" : Number(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const can = (perm) => me.permissions.includes("*") || me.permissions.includes(perm);
function toast(text) { const m = $("#msg"); m.textContent = text; m.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = "none", 5000); }
async function api(path, opts = {}) {
  const res = await fetch(path, {...opts, headers: {"Authorization": "Bearer " + token, "Content-Type": "application/json", ...(opts.headers || {})}});
  if (res.status === 401) { signOut(); throw new Error("Session expired. Sign in again."); }
  const body = res.headers.get("content-type")?.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}
const TABS = [
  ["overview", "Overview", "reports:read"], ["exceptions", "Exceptions", "exceptions:read"],
  ["approvals", "Approvals", "adjustments:read"], ["audit", "Audit", "audit:read"],
  ["observability", "Observability", "obs:read"], ["integrations", "Integrations", "plugins:read"],
  ["run", "Run", "runs:execute"]];
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#loginErr").textContent = "";
  const body = new URLSearchParams({grant_type: "password", username: $("#u").value, password: $("#p").value});
  const res = await fetch("/auth/token", {method: "POST", body});
  if (!res.ok) { $("#loginErr").textContent = res.status === 429 ? "Too many attempts. Wait a minute." : "Wrong username or password."; return; }
  token = (await res.json()).access_token; $("#p").value = "";
  me = await api("/auth/me");
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#who").textContent = `${me.sub} · ${me.roles.join(", ")}`;
  const allowed = TABS.filter(([, , perm]) => can(perm));
  $("#tabs").innerHTML = allowed.map(([id, label]) => `<button role="tab" data-tab="${id}">${label}</button>`).join("");
  show(allowed[0][0]);
});
function signOut() { token = null; me = null; $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
$("#logout").addEventListener("click", signOut);
$("#tabs").addEventListener("click", (e) => { if (e.target.dataset.tab) show(e.target.dataset.tab); });
async function show(id) {
  tab = id;
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === id));
  $("#view").innerHTML = '<p class="muted">Loading…</p>';
  try { await VIEWS[id](); } catch (err) { $("#view").innerHTML = `<div class="panel bad">${esc(err.message)}</div>`; }
}
const kpi = (label, val, sub = "") => `<div class="kpi"><div class="label">${esc(label)}</div><div class="val">${esc(val)}</div><div class="sub">${esc(sub)}</div></div>`;
const VIEWS = {
  async overview() {
    const r = await api("/api/reports/before-after");
    const b = r.before, a = r.after, max = Math.max(...Object.values(r.by_control).map((c) => c.value), 1);
    $("#runInfo").textContent = `Run ${r.run_id} · period ${r.period}`;
    $("#view").innerHTML = `
      <div class="grid">${kpi("Leakage identified", money(a.leakage_identified), `before: ${money(b.leakage_identified)}`)}
      ${kpi("Recovered (approved)", money(a.leakage_recovered), `pending approval: ${money(a.pending_approval)}`)}
      ${kpi("Accounts checked", a.accounts_checked_pct + "%", `before: ${b.accounts_checked_pct}%`)}
      ${kpi("Record match rate", (r.match_rate * 100).toFixed(2) + "%", "matched by rules, no model")}
      ${kpi("Model cost per exception", "$" + a.model_cost_per_exception, `total $${a.model_cost_usd}`)}</div>
      <div class="split" style="margin-top:1rem"><div class="panel"><h2>Before and after</h2>
      <table><thead><tr><th>Measure</th><th>Before (manual sample)</th><th>After (this product)</th></tr></thead><tbody>
      ${["accounts_checked_pct","controls_run","exceptions_found","leakage_identified","leakage_recovered","evidence_trail"].map((k) =>
        `<tr><td>${esc(k.replaceAll("_", " "))}</td><td>${esc(typeof b[k] === "number" ? b[k].toLocaleString() : b[k])}</td><td>${esc(typeof a[k] === "number" ? a[k].toLocaleString() : a[k])}</td></tr>`).join("")}
      </tbody></table><p class="warn">${esc(r.caveat)}</p>
      <div class="row"><button class="btn" data-dl="html">Open HTML report</button><button class="btn" data-dl="csv">Download CSV</button></div></div>
      <div class="panel"><h2>Exceptions by control</h2><table><tbody>
      ${Object.entries(r.by_control).map(([c, v]) => `<tr><td>${esc(c)} <span class="muted">${esc(v.name)}</span><div class="bar" style="width:${(v.value / max * 100).toFixed(1)}%"></div></td><td class="num">${v.count}</td><td class="num">${money(v.value)}</td></tr>`).join("")}
      </tbody></table></div></div>`;
    document.querySelectorAll("[data-dl]").forEach((btn) => btn.addEventListener("click", async () => {
      const kind = btn.dataset.dl, text = await api("/api/reports/before-after." + kind);
      const url = URL.createObjectURL(new Blob([text], {type: kind === "csv" ? "text/csv" : "text/html"}));
      if (kind === "html") window.open(url, "_blank", "noopener"); else { const a2 = document.createElement("a"); a2.href = url; a2.download = "before-after.csv"; a2.click(); }
    }));
  },
  async exceptions() {
    const rows = await api("/api/exceptions?limit=300");
    $("#view").innerHTML = `<div class="split"><div class="panel"><h2>Exceptions (${rows.length})</h2>
      <table><thead><tr><th>Control</th><th>Account</th><th>Root cause</th><th class="num">Variance</th><th>Conf.</th><th>Status</th></tr></thead>
      <tbody>${rows.map((e) => `<tr class="click" data-id="${esc(e.id)}" tabindex="0"><td>${esc(e.control)} <span class="chip">${esc(e.severity)}</span></td><td>${esc(e.account_id)}<br><span class="muted">${esc(e.bu)}</span></td><td>${esc((e.root_cause || "").replace(/^RC\d+_/, "").replaceAll("_", " "))}</td><td class="num ${e.variance < 0 ? "warn" : ""}">${money(e.variance)}</td><td>${e.confidence ?? "-"}</td><td><span class="chip">${esc(e.status)}</span></td></tr>`).join("")}</tbody></table></div>
      <div class="panel" id="detail"><h2>Detail</h2><p class="muted">Select an exception.</p></div></div>`;
    $("#view tbody").addEventListener("click", (ev) => { const tr = ev.target.closest("tr[data-id]"); if (tr) detail(tr.dataset.id); });
    $("#view tbody").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { const tr = ev.target.closest("tr[data-id]"); if (tr) detail(tr.dataset.id); } });
  },
  async approvals() {
    const rows = await api("/api/adjustments");
    $("#view").innerHTML = `<div class="panel"><h2>Adjustments</h2><p class="muted">Your approval limit: ${money(me.approval_limit)}. You cannot approve your own proposals.</p>
      <table><thead><tr><th>Adjustment</th><th>Account</th><th>Action</th><th class="num">Billed before</th><th class="num">Billed after</th><th class="num">Change</th><th>Proposed by</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map((a) => `<tr><td>${esc(a.id)}<br><span class="muted">${esc(a.control)} · ${esc(a.bu)}</span></td><td>${esc(a.account_id)}</td><td>${esc(a.action)}</td><td class="num">${money(a.before_amount)}</td><td class="num">${money(a.after_amount)}</td><td class="num">${money(a.amount)}</td><td>${esc(a.proposed_by)}</td><td><span class="chip">${esc(a.status)}</span>${a.decided_by ? `<br><span class="muted">${esc(a.decided_by)}</span>` : ""}</td>
      <td>${a.status === "pending" && can("adjustments:approve") ? `<div class="row"><button class="btn primary" data-adj="${esc(a.id)}" data-ok="1">Approve</button><button class="btn" data-adj="${esc(a.id)}" data-ok="0">Reject</button></div>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
    $("#view").addEventListener("click", async (ev) => {
      const b = ev.target.closest("button[data-adj]"); if (!b) return;
      const approve = b.dataset.ok === "1";
      const comment = approve ? "" : prompt("Reason for rejection (required):") || "";
      if (!approve && !comment) return;
      try { await api(`/api/adjustments/${b.dataset.adj}/decision`, {method: "POST", body: JSON.stringify({approve, comment})}); toast(approve ? "Approved and queued for posting." : "Rejected."); }
      catch (err) { toast(err.message); }
      show("approvals");
    }, {once: true});
  },
  async audit() {
    const rows = await api("/api/audit?limit=300");
    $("#view").innerHTML = `<div class="panel"><div class="row"><h2 style="margin:0">Audit trail</h2><button class="btn" id="verify">Verify hash chain</button><span id="chain"></span></div>
      <table style="margin-top:.7rem"><thead><tr><th>#</th><th>Time (UTC)</th><th>Actor</th><th>Action</th><th>Resource</th><th>Decision</th><th>Detail</th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td>${r.seq}</td><td>${esc(r.ts.slice(0, 19).replace("T", " "))}</td><td>${esc(r.actor)}<br><span class="muted">${esc(r.actor_type)}</span></td><td>${esc(r.action)}</td><td>${esc(r.resource)}</td><td class="${r.decision === "deny" ? "bad" : ""}">${esc(r.decision)}</td><td><span class="muted">${esc(JSON.stringify(r.detail))}</span></td></tr>`).join("")}</tbody></table></div>`;
    $("#verify").addEventListener("click", async () => { const v = await api("/api/audit/verify"); $("#chain").innerHTML = v.ok ? `<span class="ok">Chain intact: ${v.events} events</span>` : `<span class="bad">Chain broken at event ${v.first_bad_seq}</span>`; });
  },
  async observability() {
    const [roots, costs] = await Promise.all([api("/api/traces"), api("/api/costs")]);
    $("#view").innerHTML = `<div class="panel"><h2>Model usage</h2><table><thead><tr><th>Step</th><th>Model</th><th class="num">Calls</th><th class="num">Input tokens</th><th class="num">Output tokens</th><th class="num">Cost USD</th><th class="num">Avg ms</th></tr></thead><tbody>
      ${costs.map((c) => `<tr><td>${esc(c.step)}</td><td>${esc(c.model)}</td><td class="num">${c.calls}</td><td class="num">${c.input_tokens}</td><td class="num">${c.output_tokens}</td><td class="num">${c.cost_usd}</td><td class="num">${c.avg_latency_ms}</td></tr>`).join("")}</tbody></table>
      <p class="muted">Prometheus metrics are at <code>/metrics</code>. Traces are also exported over OTLP when OTEL_EXPORTER_OTLP_ENDPOINT is set.</p></div>
      <div class="split"><div class="panel"><h2>Recent traces</h2><table><thead><tr><th>Operation</th><th class="num">ms</th><th>Status</th></tr></thead><tbody id="roots">
      ${roots.map((s) => `<tr class="click" data-trace="${esc(s.trace_id)}"><td>${esc(s.name)}<br><span class="muted span">${esc(s.trace_id)}</span></td><td class="num">${s.duration_ms}</td><td>${esc(s.status)}</td></tr>`).join("")}</tbody></table></div>
      <div class="panel" id="trace"><h2>Trace</h2><p class="muted">Select a trace.</p></div></div>`;
    $("#roots").addEventListener("click", async (ev) => {
      const tr = ev.target.closest("tr[data-trace]"); if (!tr) return;
      const spans = await api("/api/traces/" + tr.dataset.trace), t0 = spans[0]?.start_ns ?? 0;
      const total = Math.max(...spans.map((s) => (s.start_ns - t0) / 1e6 + s.duration_ms), 1);
      $("#trace").innerHTML = `<h2>Trace ${esc(tr.dataset.trace.slice(0, 12))}… (${spans.length} spans)</h2>` + spans.slice(0, 300).map((s) =>
        `<div class="span">${esc(s.name)} <span class="muted">${s.duration_ms} ms</span><div class="bar" style="margin-left:${((s.start_ns - t0) / 1e6 / total * 100).toFixed(2)}%;width:${(s.duration_ms / total * 100).toFixed(2)}%"></div></div>`).join("");
    });
  },
  async integrations() {
    const [pl, meta] = await Promise.all([api("/api/plugins"), api("/api/meta")]);
    $("#view").innerHTML = `<div class="panel"><h2>Plug-ins</h2><table><thead><tr><th>Name</th><th>Type</th><th>Kind</th><th>Events</th><th>Mode</th></tr></thead><tbody>
      ${pl.configured.map((p) => `<tr><td>${esc(p.name)}</td><td>${esc(p.type)}</td><td>${esc(p.kind)}</td><td>${p.events.map((e) => `<span class="chip">${esc(e)}</span>`).join(" ")}</td><td class="${p.dry_run ? "warn" : "ok"}">${p.dry_run ? "dry run" : "live"}</td></tr>`).join("")}</tbody></table>
      <div class="row" style="margin-top:.6rem">${pl.outbox.map((o) => `<span class="chip">${esc(o.status)}: ${o.n}</span>`).join("")}${can("plugins:dispatch") ? '<button class="btn" id="dispatch">Deliver queued events</button>' : ""}</div></div>
      <div class="panel"><h2>Recent deliveries</h2><table><thead><tr><th>Plug-in</th><th>Event</th><th>Status</th><th>Result</th></tr></thead><tbody>
      ${pl.recent.slice(0, 15).map((o) => `<tr><td>${esc(o.plugin)}</td><td>${esc(o.event)}</td><td>${esc(o.status)}</td><td><span class="muted">${esc(JSON.stringify(o.result || o.last_error).slice(0, 160))}</span></td></tr>`).join("")}</tbody></table></div>
      <div class="split"><div class="panel"><h2>Tools (also served over MCP at /mcp)</h2><table><tbody>${meta.tools.map((t) => `<tr><td><code>${esc(t.name)}</code> ${t.write ? '<span class="chip warn">write</span>' : ""}</td><td>${esc(t.description)}</td></tr>`).join("")}</tbody></table></div>
      <div class="panel"><h2>Agent skills</h2><table><tbody>${meta.skills.map((s) => `<tr><td><code>${esc(s.name)}</code></td><td>${esc(s.description)}</td></tr>`).join("")}</tbody></table>
      <p class="muted">A2A agent card: <code>/.well-known/agent-card.json</code></p></div></div>`;
    $("#dispatch")?.addEventListener("click", async () => { toast(JSON.stringify(await api("/api/plugins/dispatch", {method: "POST"}))); show("integrations"); });
  },
  async run() {
    const runs = await api("/api/runs");
    $("#view").innerHTML = `<div class="panel"><h2>Start a reconciliation run</h2><form id="runForm" class="row">
      <label>Period <input name="period" value="2026-10" pattern="\\d{4}-\\d{2}" required size="8"></label>
      <label>Accounts <input name="accounts" type="number" value="400" min="10" max="20000"></label>
      <label>Data <select name="data"><option value="synthetic">Synthetic (demo)</option><option value="sources">Source plug-ins</option></select></label>
      <button class="btn primary">Run</button></form></div>
      <div class="panel"><h2>Runs</h2><table><thead><tr><th>Run</th><th>Period</th><th>Started by</th><th class="num">Records</th><th class="num">Exceptions</th><th class="num">Match rate</th></tr></thead><tbody>
      ${runs.map((r) => `<tr><td>${esc(r.id)}</td><td>${esc(r.period)}</td><td>${esc(r.started_by)}</td><td class="num">${r.stats.records ?? "-"}</td><td class="num">${r.stats.exceptions ?? "-"}</td><td class="num">${r.stats.match_rate ?? "-"}</td></tr>`).join("")}</tbody></table></div>`;
    $("#runForm").addEventListener("submit", async (e) => {
      e.preventDefault(); const f = new FormData(e.target); const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Running…";
      try { const r = await api("/api/runs", {method: "POST", body: JSON.stringify({period: f.get("period"), accounts: Number(f.get("accounts")), data: f.get("data")})}); toast(`Run finished: ${r.stats.exceptions} exceptions.`); }
      catch (err) { toast(err.message); }
      show("run");
    });
  },
};
async function detail(id) {
  const d = await api("/api/exceptions/" + id), e = d.exception, c = d.case;
  const checks = c?.verification?.checks || [];
  $("#detail").innerHTML = `<h2>${esc(e.id)}</h2>
    <p>${esc(e.summary)}</p>
    <table><tbody><tr><th>Expected</th><td class="num">${money(e.expected)}</td></tr><tr><th>Actual</th><td class="num">${money(e.actual)}</td></tr><tr><th>Variance</th><td class="num">${money(e.variance)} ${esc(e.currency)}</td></tr>
    <tr><th>Triage</th><td>${esc(e.root_cause)} → ${esc(e.action)} (confidence ${e.confidence})</td></tr></tbody></table>
    <p class="muted">${esc(e.rationale)}</p>
    <details><summary>Evidence records (${e.record_uids.length})</summary><pre>${esc(e.record_uids.join("\n"))}</pre></details>
    ${c ? `<h2 style="margin-top:1rem">Case ${esc(c.id)} <span class="chip">${esc(c.status)}</span></h2><p>Skill: <code>${esc(c.skill)}</code></p><p>${esc(c.findings?.narrative)}</p>
      <table><tbody>${checks.map((k) => `<tr><td class="${k.ok ? "ok" : "bad"}">${k.ok ? "pass" : "fail"}</td><td>${esc(k.check)}</td><td class="muted">${esc(k.detail)}</td></tr>`).join("")}</tbody></table>` : ""}
    ${d.adjustments.map((a) => `<p>Adjustment <code>${esc(a.id)}</code>: ${esc(a.action)} ${money(a.amount)} <span class="chip">${esc(a.status)}</span></p>`).join("")}
    ${can("cases:work") && (!c || c.status === "needs_review") ? '<button class="btn primary" id="inv">Investigate with agent</button>' : ""}`;
  $("#inv")?.addEventListener("click", async (ev) => {
    ev.target.disabled = true; ev.target.textContent = "Investigating…";
